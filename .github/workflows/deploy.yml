# Publie le site dès qu’un changement arrive sur la branche main (1 à 2 minutes).
# Vérifie d’abord les fichiers labs/*.json et génère labs/index.json :
# un fichier invalide bloque la publication, le site en ligne reste alors inchangé.
# Onglet « Actions » du dépôt : suivre une publication, ou la relancer (« Run workflow »).
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les structures et générer labs/index.json
        run: python3 tools/validate_labs.py labs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
